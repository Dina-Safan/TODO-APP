<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <!-- FontAwesome File -->
    <link rel="stylesheet" href="../CSS/all.min.css">
    <!-- Bootstrap File -->
    <link rel="stylesheet" href="../CSS/bootstrap.min.css">
    <!-- global Style -->
     <link rel="stylesheet" href="../CSS/style.css">
    <!-- Nav Style -->
    <link rel="stylesheet" href="../CSS/nav.css">
</head>
<body>
    <nav class="mt-3">
        <div class="container">
         <div class="nav-container d-flex justify-content-between align-items-center">
               <div class="logo d-flex gap-3 align-items-center">
                <img src="../assets/images/logo2.png" alt="logo">
                <h1 class="h3 mb-0">TODO APP</h1>
            </div>

            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" spellcheck="false" placeholder="Search Task...">
            </div>

            <div class="user-info d-flex align-items-center gap-3">
                <div class="avatar">
                    <img id="userImage" src="" alt="userImage">
                </div>
                <div class="info">
                    <p class="mb-0 fw-bold  fs-5">Welcome</p>
                    <p id="userName" class="mb-0 fw-medium"></p>
                  
                </div>
            </div>
         </div>

        </div>

    </nav> 
    <script src="../JS/Navbar.js"></script>
</body>
</html>
