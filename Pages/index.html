<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO</title>

    <script>
        if(!localStorage.getItem("currentUser")){
            window.location.href="./login.html"
        }
    </script>
    <!-- Bootstrap Style -->
     <link rel="stylesheet" href="../CSS/bootstrap.min.css">
    <!-- FontAwesome Style -->
     <link rel="stylesheet" href="../CSS/all.min.css">
    <!-- Global Style -->
     <link rel="stylesheet" href="../CSS/style.css">
    <!-- My Style -->
    <link rel="stylesheet" href="../CSS/home.css">
</head>
<body>
<div id="navbar-container"></div>

<main>
    <section class="helper  ">
    <div class="container">
    <div class=" d-flex flex-wrap align-items-center justify-content-between">
    <div class="header">
        <p class="mb-0 d-flex gap-2 align-items-center"><i class="fa-solid fa-list-check"></i> <span>All of tasks</span></p>

    </div>
    <div class="icons  d-flex flex-wrap align-items-center  gap-2">
        <div class="style-mode d-flex align-items-center gap-2">
            <i class="fa-solid fa-grip-vertical"></i>
            <i class="fa-solid fa-bars"></i>
        </div>
         <div class="mode">
            <i class="fa-solid fa-sun"></i>
            <i class="fa-solid fa-moon"></i>
        </div>

    </div>
        </div>
    </div>
  
    </section>
   <div class="btn-add d-flex justify-content-center my-4">
    <button class="d-flex gap-3 align-items-center justify-content-center"><i class="fa-solid fa-square-plus"></i> Add Task</button>
   </div>
    <section class="task-container mb-5">
        <div class="container">
            <div class="row ">
                <div class="col-6 col-md-4 col-lg-4">
                    <div class="inner">
                        <div class="card nextUp ">
                            <div class="card-title py-2  px-3 py-2 d-flex justify-content-between align-items-center">
                                <div class="status">Next Up </div>
                                <div class="counter next">0</div>
                            </div>
                            <div class="card-body d-flex flex-column gap-3 pt-2 ">

                            </div>
                        </div>
                    </div>
                </div>


                <div class="col-6 col-md-4 col-lg-4">
                    <div class="inner">
                        <div class="card  inProgress">
                            <div class="card-title py-2 px-3 d-flex justify-content-between align-items-center">
                                <div class="status">In Progress </div>
                                <div class="counter progress">0</div>
                            </div>

                            <div class="card-body d-flex flex-column gap-3 pt-2 ">
                                
                            </div>
                        </div>
                    </div>
                </div>
                

                <div class="col-6 col-md-4 col-lg-4">
                    <div class="inner">
                        <div class="card done ">
                            <div class="card-title py-2 px-3 d-flex justify-content-between align-items-center">
                                <div class="status">Done </div>
                                <div class="counter done">0</div>
                            </div>

                            <div class="card-body d-flex flex-column gap-3 pt-2 ">

                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>

    </section>
</main>

<section class="modal position-absolute  w-100 h-100 d-none">
    <div class="container h-100 d-flex justify-content-center  align-items-center">
        <div class="form  d-flex gap-4 flex-column">
            <select class="form-select" aria-label="Default select example" id="statusInput">
                <option hidden disabled selected value="">Select Task status</option>
                <option value="nextUp">Next Up</option>
                <option value="inProgress">In Progress</option>
                <option value="done">Done</option>
            </select>
            <select class="form-select" aria-label="Default select example" id="categoryInput">
                <option hidden disabled selected vlaue="">Select Category</option>
                <option value="Education">Education</option>
                <option value="Finance">Finance</option>
                <option value="Health">Health & Fitness</option>
                <option value="Productivity">Productivity</option>
            </select>

              <div class="title">
                    <input id="titleInput"  type="text" class="form-control" placeholder=" Task Title..." aria-label="title" name="Title">
                    <p class=" mt-2 mb-0 d-none" role="alert">  Task title must be at least 5 letters and contain only letters or spaces</p>
                </div> 
              <div class="description">
                    <textarea id="descriptionInput" class="form-control" aria-label="description" name="Description" placeholder="Description........." class="w-100"></textarea>
                    <p class=" mt-2 mb-0 d-none" role="alert">Description must be at least 15 characters long. </p>
                </div> 

                <button id="addTaskBtn">Add Task</button>
                <button id="updateTaskBtn" class="d-none" >Update Task</button>
        
        </div>
    </div>
</section>



<script src="../JS/Navbar.js"></script>
<script src="../JS/index.js" type="module"></script>
</body>
</html>
