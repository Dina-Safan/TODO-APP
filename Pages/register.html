<!DOCTYPE html>
<html lang="en"  data-bs-theme="lihgt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!-- FontAwesome File -->
    <link rel="stylesheet" href="./../CSS/all.min.css">
    <!-- BootStrap File -->
    <link rel="stylesheet" href="../CSS/bootstrap.min.css">
    <!-- Shared Style -->
     <link rel="stylesheet" href="../CSS/style.css">
    <!-- My Register Style -->
    <link rel="stylesheet" href="../CSS/register.css">
</head>
<body>
    <section class="register-page  d-flex justify-content-center align-items-center min-vh-100">
        <div class="container ">
            <div class="row d-flex flex-wrap align-items-center justify-content-between ">
            <div class="form col-12 col-lg-6 p-4 p-md-4  order-2 order-lg-1">
                <h2 class="text-center mb-4 fw-medium">Create Account</h2>
              <div class="row ">
                <div class="col-6">
                    <input type="text" class="form-control" placeholder="First name" aria-label="First name" name="First name">
                     <p class=" mt-2 invisible" role="alert">Must Start With Capital Lette</p>
                </div>
                <div class="col-6">
                    <input type="text" class="form-control" placeholder="Last name" aria-label="Last name" name="Last name">
                     <p class=" mt-2 invisible" role="alert">Must Start With Capital Lette</p>
                </div>       
                <div class="col-12">
                    <input type="email" class="form-control" placeholder=" Email" aria-label="Email" name="Email">
                    <p class=" mt-2 invisible" role="alert"> Not Valid Email</p>
                </div>   
                <div class="col-12">
                    <input type="password" class="form-control" placeholder="Password" aria-label="Password" name="Password">
                     <p class=" mt-2 invisible" role="alert"> More than 8 letter</p>
                </div>   
                <div class="col-12">
                    <input type="Repassword" class="form-control" placeholder="Confirm Password" aria-label="RePassword" name="RePassword">
                    <p class=" mt-2 invisible" role="alert"> not match</p>
                </div>  
                <div class="col-12">
                    <button type="button" class="btn btn-primary w-100 py-2 fw-semibold">Create An Account</button> 
                </div>  
               
             </div>
             
             <p class="text-center mt-3">Already Have An Account? <a href="./login.html" >Sign In</a></p>
          </div>
    
        <div class="image d-none d-lg-block col-lg-5 mb-4 mb-lg-0 order-1 order-lg-2 ">
            <img src="../assets/images/todo-login7.jpg" alt="" class="img-fluid ">
    
        </div>

            </div>
      

        </div>
    </section>

    
</body>
</html>
